<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini HTML Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;font-size:13px;background:#e8eaed;color:#333;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── Toolbar ── */
#toolbar{background:#fff;border-bottom:1px solid #d0d0d0;padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.tb{padding:3px 8px;border:1px solid #ccc;border-radius:3px;background:#fafafa;cursor:pointer;font-size:12px;line-height:1.4;}
.tb:hover{background:#e4eaf8;border-color:#888;}
.tb.warn{background:#fff3cd;border-color:#f0a800;}
.tb.warn:hover{background:#ffe8a0;}
.sep{width:1px;height:22px;background:#ddd;margin:0 3px;flex-shrink:0;}
#style-sel{padding:3px 5px;border:1px solid #ccc;border-radius:3px;font-size:12px;max-width:150px;}

/* ── Layout ── */
#main{display:flex;flex:1;overflow:hidden;}

/* ── Editor column ── */
#col-edit{display:flex;flex-direction:column;flex:1 1 0;min-width:200px;border-right:1px solid #d0d0d0;}
#edit-scroll{flex:1;overflow-y:auto;background:#fff;padding:20px 24px;}
#editor{outline:none;min-height:100%;}

/* ── HTML panel ── */
#html-panel{flex-shrink:0;display:flex;flex-direction:column;background:#1a1a2e;border-top:2px solid #333;transition:height .2s;}
#html-panel.collapsed{height:32px;}
#html-panel.expanded{height:220px;}
#html-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:#252545;flex-shrink:0;gap:5px;}
#html-bar-left{display:flex;align-items:center;gap:6px;}
#html-bar span{color:#9998c8;font-size:11px;letter-spacing:.3px;white-space:nowrap;}
.html-btn{padding:2px 9px;border:none;color:#fff;border-radius:3px;cursor:pointer;font-size:11px;}
#copy-btn{background:#27ae60;}
#copy-btn:hover{background:#1e8449;}
#edit-html-btn{background:#4a4a8a;}
#edit-html-btn:hover{background:#6060aa;}
#toggle-html-btn{background:transparent;border:1px solid #555;color:#aaa;padding:1px 6px;font-size:11px;border-radius:3px;cursor:pointer;}
#html-body{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* Read-only output */
#html-out-wrap{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;}
#html-out{font-family:'Courier New',monospace;font-size:11px;color:#a8d8a8;word-break:break-all;white-space:pre-wrap;line-height:1.5;flex:1;}

/* Editable HTML textarea */
#html-edit-wrap{flex:1;display:flex;flex-direction:column;padding:6px 8px;gap:4px;}
#html-textarea{flex:1;font-family:'Courier New',monospace;font-size:11px;background:#111128;color:#c8e6c9;border:1px solid #444;border-radius:3px;padding:6px;resize:none;outline:none;word-break:break-all;}
#html-edit-actions{display:flex;gap:6px;flex-shrink:0;}
#html-edit-actions button{padding:3px 10px;font-size:11px;border:none;border-radius:3px;cursor:pointer;}
#apply-html-btn{background:#27ae60;color:#fff;}
#apply-html-btn:hover{background:#1e8449;}
#discard-html-btn{background:#555;color:#fff;}
#discard-html-btn:hover{background:#777;}

/* ── Drag handle ── */
#drag-handle{width:5px;flex-shrink:0;background:#d0d0d0;cursor:col-resize;position:relative;transition:background .15s;}
#drag-handle:hover,#drag-handle.dragging{background:#1a6fdb;}

/* ── Styles column ── */
#col-styles{width:230px;flex-shrink:0;display:flex;flex-direction:column;background:#f8f8f8;border-right:1px solid #d0d0d0;overflow:hidden;}
#col-styles h3{padding:6px 10px;font-size:11px;background:#ebebeb;border-bottom:1px solid #d0d0d0;color:#555;letter-spacing:.3px;text-transform:uppercase;flex-shrink:0;}

#wrap-section{padding:7px 10px;border-bottom:1px solid #d0d0d0;flex-shrink:0;}
#wrap-section label{display:block;font-size:11px;color:#777;margin-bottom:3px;}
#wrap-style{width:100%;padding:4px;border:1px solid #ccc;border-radius:3px;font-size:11px;font-family:monospace;resize:vertical;height:50px;}

#vars-section{padding:7px 10px;border-bottom:1px solid #d0d0d0;flex-shrink:0;}
#vars-section label{display:block;font-size:11px;color:#777;margin-bottom:3px;}
.var-row{display:flex;gap:3px;margin-bottom:3px;align-items:center;}
.var-row input{flex:1;min-width:0;padding:3px;border:1px solid #ccc;border-radius:3px;font-size:11px;font-family:monospace;}

#styles-list{flex:1;overflow-y:auto;padding:5px 7px;}
.sitem{display:flex;flex-direction:column;margin-bottom:4px;}
.sitem-row{display:flex;align-items:center;gap:3px;}
.sitem-name{flex:1;min-width:0;padding:4px 7px;border:1px solid #d0d0d0;border-radius:3px;background:#fff;cursor:pointer;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;}
.sitem-name:hover{background:#dbeafe;border-color:#93c5fd;}
.sitem-edit{padding:2px 5px;border:1px solid #ddd;border-radius:3px;background:#fff;cursor:pointer;color:#555;font-size:10px;flex-shrink:0;}
.sitem-edit:hover{background:#fffbe6;border-color:#f0a800;}
.sitem-del{padding:2px 5px;border:1px solid #ddd;border-radius:3px;background:#fff;cursor:pointer;color:#c00;font-size:10px;flex-shrink:0;}
.sitem-editor{display:none;flex-direction:column;gap:3px;margin-top:3px;padding:6px 7px;background:#fffbe6;border:1px solid #e8d870;border-radius:3px;}
.sitem-editor.open{display:flex;}
.sitem-editor input{padding:3px 5px;border:1px solid #ccc;border-radius:3px;font-size:11px;width:100%;}
.sitem-editor textarea{padding:3px 5px;border:1px solid #ccc;border-radius:3px;font-size:11px;font-family:monospace;height:46px;width:100%;resize:vertical;}
.sitem-editor-btns{display:flex;gap:4px;}
.sitem-editor-btns button{flex:1;padding:3px 0;font-size:11px;border:none;border-radius:3px;cursor:pointer;}
.sitem-save{background:#27ae60;color:#fff;}
.sitem-save:hover{background:#1e8449;}
.sitem-cancel{background:#888;color:#fff;}
.sitem-cancel:hover{background:#666;}

#add-form{padding:7px 10px;border-top:1px solid #d0d0d0;flex-shrink:0;}
#add-form input,#add-form textarea{width:100%;margin-bottom:4px;padding:4px;border:1px solid #ccc;border-radius:3px;font-size:11px;}
#add-form textarea{height:50px;font-family:monospace;resize:vertical;}
#add-form button{width:100%;padding:4px;background:#1a6fdb;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;}
#add-form button:hover{background:#1559b5;}

/* ── Preview column ── */
#col-preview{flex:1 1 0;min-width:200px;display:flex;flex-direction:column;background:#fff;overflow:hidden;}
#prev-bar{padding:6px 12px;background:#f0f0f0;border-bottom:1px solid #d0d0d0;font-size:11px;color:#666;letter-spacing:.3px;text-transform:uppercase;flex-shrink:0;}
#preview{flex:1;overflow-y:auto;padding:16px;}
</style>
</head>
<body>
<div id="toolbar">
  <button class="tb" onmousedown="e(event,'bold')" title="Fetstil"><b>B</b></button>
  <button class="tb" onmousedown="e(event,'italic')" title="Kursiv"><i>I</i></button>
  <button class="tb" onmousedown="e(event,'underline')" title="Understruken"><u>U</u></button>
  <div class="sep"></div>
  <button class="tb" onmousedown="ins(event,'p')" title="Infoga stycke">¶ Stycke</button>
  <button class="tb" onmousedown="ins(event,'spacer')" title="Infoga vertikalt mellanrum">↕ Mellanrum</button>
  <button class="tb" onmousedown="ins(event,'h')" title="Infoga rubrik">H Rubrik</button>
  <button class="tb" onmousedown="ins(event,'ul')" title="Punktlista">· Lista</button>
  <button class="tb" onmousedown="ins(event,'ol')" title="Numrerad lista">1. Lista</button>
  <button class="tb" onmousedown="ins(event,'box')" title="Info-ruta med rubrik">⬜ Box</button>
  <button class="tb" onmousedown="ins(event,'section')" title="Sektion med rubrik + lista">📋 Sektion</button>
  <div class="sep"></div>
  <select id="style-sel"><option value="">── Applicera stil ──</option></select>
  <button class="tb" onmousedown="applySelStyle(event)" title="Applicera vald stil på markerat block">Applicera</button>
  <div class="sep"></div>
  <button class="tb" onmousedown="removeStyle(event)" title="Ta bort inline-stil från valt block">✕ Stil</button>
  <button class="tb warn" onclick="pasteWordDialog()" title="Klistra in och rensa Word/Office-HTML">📋 Klistra in Word-HTML</button>
  <button class="tb" onclick="clearAll()" title="Rensa allt">🗑 Rensa</button>
</div>

<div id="main">
  <!-- Left: editor + html output -->
  <div id="col-edit">
    <div id="edit-scroll">
      <div id="editor" contenteditable="true" spellcheck="true">
<p style="margin:0 0 12px 0;">Börja skriva eller infoga element med verktygsfältet ovan.</p>
      </div>
    </div>

    <div id="html-panel" class="expanded">
      <div id="html-bar">
        <div id="html-bar-left">
          <button id="toggle-html-btn" onclick="toggleHtmlPanel()" title="Minimera/expandera">▼</button>
          <span>HTML-UTDATA</span>
        </div>
        <div style="display:flex;gap:5px;">
          <button id="edit-html-btn" class="html-btn" onclick="openHtmlEdit()" title="Redigera HTML direkt eller klistra in HTML">Redigera / Klistra in HTML</button>
          <button id="copy-btn" class="html-btn" onclick="copyHtml()">Kopiera</button>
        </div>
      </div>
      <div id="html-body">
        <div id="html-out-wrap"><div id="html-out"></div></div>
        <div id="html-edit-wrap" style="display:none;">
          <textarea id="html-textarea" placeholder="Klistra in eller redigera HTML här..."></textarea>
          <div id="html-edit-actions">
            <button id="apply-html-btn" onclick="applyHtmlEdit()">✓ Tillämpa</button>
            <button id="discard-html-btn" onclick="closeHtmlEdit()">Avbryt</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Drag handle -->
  <div id="drag-handle" title="Dra för att justera storlek"></div>

  <!-- Middle: styles -->
  <div id="col-styles">
    <h3>Stilar &amp; Inställningar</h3>
    <div id="wrap-section">
      <label>Yttre wrapper-stil:</label>
      <textarea id="wrap-style" oninput="update()">max-width:760px;font-family:Arial,sans-serif;font-size:14px;line-height:1.5;color:#222;</textarea>
    </div>
    <div id="vars-section">
      <label>CSS-variabler (preview):</label>
      <div id="var-rows"></div>
      <button class="tb" style="width:100%;margin-top:2px;font-size:11px;" onclick="addVarRow()">+ Variabel</button>
    </div>
    <h3 style="border-top:1px solid #d0d0d0;">Sparade stilar</h3>
    <div id="styles-list"></div>
    <div id="add-form">
      <input id="new-name" placeholder="Stilnamn">
      <textarea id="new-css" placeholder="CSS (t.ex. font-size:16px;font-weight:600;)"></textarea>
      <button onmousedown="addStyle(event)">+ Spara stil</button>
    </div>
  </div>

  <!-- Right: preview -->
  <div id="col-preview">
    <div id="prev-bar">Förhandsgranskning</div>
    <div id="preview"></div>
  </div>
</div>

<!-- Word paste dialog -->
<div id="word-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:6px;padding:16px;width:600px;max-width:90vw;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);">
    <div style="font-weight:600;font-size:14px;">Klistra in Word/Office-HTML</div>
    <div style="font-size:12px;color:#666;">Klistra in rå HTML (t.ex. kopierad från Word eller ett annat system). All Microsoft-formatering rensas bort och strukturen bevaras.</div>
    <textarea id="word-input" style="height:200px;font-family:monospace;font-size:11px;padding:8px;border:1px solid #ccc;border-radius:3px;resize:vertical;" placeholder="Klistra in HTML här..."></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button onclick="closeWordDialog()" style="padding:5px 14px;border:1px solid #ccc;border-radius:3px;cursor:pointer;background:#f5f5f5;">Avbryt</button>
      <button onclick="applyWordPaste()" style="padding:5px 14px;border:none;border-radius:3px;cursor:pointer;background:#27ae60;color:#fff;">Rensa &amp; Infoga</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let styles = [];
let cssVars = [{ name: '--muBlue', value: '#1a5fa8' }];
let htmlPanelOpen = true;

const editor = document.getElementById('editor');
const htmlOut = document.getElementById('html-out');
const preview = document.getElementById('preview');
const styleSel = document.getElementById('style-sel');

const DEFAULT_STYLES = [
  { name: 'Brödtext',         css: 'margin:0 0 12px 0;' },
  { name: 'Blå rubrik',       css: 'margin:0 0 6px 0;font-size:16px;font-weight:600;color:var(--muBlue);' },
  { name: 'Info-box wrapper', css: 'margin:0 0 14px 0;padding:12px 14px;background:#f7f9fc;border-left:4px solid var(--muBlue);border-radius:4px;' },
  { name: 'Sektion wrapper',  css: 'margin:0 0 14px 0;' },
  { name: 'Lista',            css: 'margin:0;padding-left:20px;' },
  { name: 'Listpunkt',        css: 'margin:0 0 6px 0;' },
  { name: 'Sista listpunkt',  css: 'margin:0;' },
];

// ── Serialise compact HTML ─────────────────────────────────
function serialise(node) {
  let out = '';
  for (const ch of node.childNodes) {
    if (ch.nodeType === 3) {
      const t = ch.textContent;
      if (t) out += t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    } else if (ch.nodeType === 1) {
      const tag = ch.tagName.toLowerCase();
      if (tag === 'br') continue;
      let attrs = '';
      for (const a of ch.attributes) {
        if (a.name === 'contenteditable') continue;
        attrs += ` ${a.name}="${a.value.replace(/"/g,'&quot;')}"`;
      }
      const inner = serialise(ch);
      if (['img','hr','input'].includes(tag)) {
        out += `<${tag}${attrs}>`;
      } else {
        out += `<${tag}${attrs}>${inner}</${tag}>`;
      }
    }
  }
  return out;
}

function getHtml() {
  const ws = document.getElementById('wrap-style').value.trim();
  const inner = serialise(editor);
  return `<div style="${ws}">${inner}</div>`;
}

function update() {
  const html = getHtml();
  htmlOut.textContent = html;
  const varsCss = cssVars.map(v => `${v.name}:${v.value}`).join(';');
  preview.innerHTML = `<div style="${varsCss}">${html}</div>`;
}

// ── HTML panel toggle ──────────────────────────────────────
function toggleHtmlPanel() {
  htmlPanelOpen = !htmlPanelOpen;
  const panel = document.getElementById('html-panel');
  const btn = document.getElementById('toggle-html-btn');
  panel.className = htmlPanelOpen ? 'expanded' : 'collapsed';
  btn.textContent = htmlPanelOpen ? '▼' : '▲';
}

// ── HTML edit mode ─────────────────────────────────────────
function openHtmlEdit() {
  if (!htmlPanelOpen) toggleHtmlPanel();
  document.getElementById('html-out-wrap').style.display = 'none';
  document.getElementById('html-edit-wrap').style.display = 'flex';
  document.getElementById('html-textarea').value = editor.innerHTML;
  document.getElementById('edit-html-btn').textContent = 'Avbryt redigering';
  document.getElementById('edit-html-btn').onclick = closeHtmlEdit;
  document.getElementById('copy-btn').style.display = 'none';
}

function closeHtmlEdit() {
  document.getElementById('html-out-wrap').style.display = '';
  document.getElementById('html-edit-wrap').style.display = 'none';
  document.getElementById('edit-html-btn').textContent = 'Redigera / Klistra in HTML';
  document.getElementById('edit-html-btn').onclick = openHtmlEdit;
  document.getElementById('copy-btn').style.display = '';
}

function applyHtmlEdit() {
  const val = document.getElementById('html-textarea').value.trim();
  if (!val) return;
  editor.innerHTML = val;
  closeHtmlEdit();
  update();
  schedSave();
}

// ── Word/Office HTML cleaner ───────────────────────────────
function cleanWordHtml(html) {
  // Remove conditional comments
  html = html.replace(/<!--\[if[\s\S]*?\[endif\]-->/gi, '');
  // Remove Office XML blocks
  html = html.replace(/<xml[\s\S]*?<\/xml>/gi, '');
  html = html.replace(/<!\[CDATA[\s\S]*?\]\]>/gi, '');
  // Remove namespaced tags (o:p, w:*, m:*, etc.)
  html = html.replace(/<\/?[a-z]+:[^>]*>/gi, '');
  // Remove style and script tags
  html = html.replace(/<style[\s\S]*?<\/style>/gi, '');
  html = html.replace(/<script[\s\S]*?<\/script>/gi, '');
  // Remove all class attributes
  html = html.replace(/\s+class="[^"]*"/gi, '');
  html = html.replace(/\s+class='[^']*'/gi, '');
  // Remove all id attributes
  html = html.replace(/\s+id="[^"]*"/gi, '');
  // Remove all style attributes (Word styles are polluted with mso-*)
  html = html.replace(/\s+style="[^"]*"/gi, '');
  html = html.replace(/\s+style='[^']*'/gi, '');
  // Remove lang, align, valign, width, height, border, cellpadding etc.
  html = html.replace(/\s+(lang|align|valign|width|height|border|cellpadding|cellspacing|bgcolor|color)="[^"]*"/gi, '');
  // Unwrap <span> tags (keep content)
  html = html.replace(/<span[^>]*>([\s\S]*?)<\/span>/gi, '$1');
  // Unwrap <font> tags
  html = html.replace(/<font[^>]*>([\s\S]*?)<\/font>/gi, '$1');
  // Replace <strong>/<b> with <b>
  html = html.replace(/<\/?(strong)(\s[^>]*)?>/gi, (m, tag, attrs) => m.startsWith('</') ? '</b>' : '<b>');
  // Replace <em> with <i>
  html = html.replace(/<\/?(em)(\s[^>]*)?>/gi, (m) => m.startsWith('</') ? '</i>' : '<i>');
  // Add default margins to p and li
  html = html.replace(/<p(\s[^>]*)?>/gi, '<p style="margin:0 0 12px 0;">');
  html = html.replace(/<li(\s[^>]*)?>/gi, '<li style="margin:0 0 6px 0;">');
  html = html.replace(/<ul(\s[^>]*)?>/gi, '<ul style="margin:0;padding-left:20px;">');
  html = html.replace(/<ol(\s[^>]*)?>/gi, '<ol style="margin:0;padding-left:20px;">');
  // Convert heading tags to styled divs
  html = html.replace(/<h[1-3](\s[^>]*)?>/gi, '<div style="margin:0 0 6px 0;font-size:16px;font-weight:600;color:var(--muBlue);">');
  html = html.replace(/<\/h[1-6]>/gi, '</div>');
  // Remove remaining unknown attributes from remaining tags
  // Collapse multiple spaces/newlines
  html = html.replace(/\n\s*\n/g, '\n');
  // Remove empty paragraphs that Word loves to add
  html = html.replace(/<p[^>]*>\s*<\/p>/gi, '');
  html = html.replace(/<p[^>]*>&nbsp;<\/p>/gi, '');
  return html.trim();
}

function pasteWordDialog() {
  document.getElementById('word-dialog').style.display = 'flex';
  document.getElementById('word-input').value = '';
  setTimeout(() => document.getElementById('word-input').focus(), 50);
}

function closeWordDialog() {
  document.getElementById('word-dialog').style.display = 'none';
}

function applyWordPaste() {
  const raw = document.getElementById('word-input').value.trim();
  if (!raw) return;
  const cleaned = cleanWordHtml(raw);
  editor.innerHTML = cleaned;
  closeWordDialog();
  update();
  schedSave();
}

// ── Toolbar helpers ────────────────────────────────────────
function e(ev, cmd) {
  ev.preventDefault();
  document.execCommand(cmd, false, null);
  update();
}

function ins(ev, type) {
  ev.preventDefault();
  editor.focus();
  const sel = window.getSelection();
  const range = sel && sel.rangeCount ? sel.getRangeAt(0) : null;

  let html = '';
  switch (type) {
    case 'p':
      html = '<p style="margin:0 0 12px 0;">Nytt stycke</p>'; break;
    case 'spacer':
      html = '<div style="margin:0 0 16px 0;"></div>'; break;
    case 'h':
      html = '<div style="margin:0 0 6px 0;font-size:16px;font-weight:600;color:var(--muBlue);">Rubrik</div>'; break;
    case 'ul':
      html = '<ul style="margin:0;padding-left:20px;"><li style="margin:0 0 6px 0;">Punkt 1</li><li style="margin:0 0 6px 0;">Punkt 2</li><li style="margin:0;">Punkt 3</li></ul>'; break;
    case 'ol':
      html = '<ol style="margin:0;padding-left:20px;"><li style="margin:0 0 6px 0;">Punkt 1</li><li style="margin:0 0 6px 0;">Punkt 2</li><li style="margin:0;">Punkt 3</li></ol>'; break;
    case 'box':
      html = '<div style="margin:0 0 14px 0;padding:12px 14px;background:#f7f9fc;border-left:4px solid var(--muBlue);border-radius:4px;"><div style="margin:0 0 6px 0;font-size:16px;font-weight:600;color:var(--muBlue);">Rubrik</div><p style="margin:0;">Innehåll...</p></div>'; break;
    case 'section':
      html = '<div style="margin:0 0 14px 0;"><div style="margin:0 0 6px 0;font-size:16px;font-weight:600;color:var(--muBlue);">Rubrik</div><ul style="margin:0;padding-left:20px;"><li style="margin:0 0 6px 0;">Punkt 1</li><li style="margin:0 0 6px 0;">Punkt 2</li><li style="margin:0;">Punkt 3</li></ul></div>'; break;
  }

  insertHtmlAtCaret(html, range);
  update();
}

function insertHtmlAtCaret(html, range) {
  if (range) {
    range.collapse(false);
    const frag = document.createRange().createContextualFragment(html);
    const last = frag.lastChild;
    range.insertNode(frag);
    if (last) {
      const r2 = document.createRange();
      r2.setStartAfter(last);
      r2.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r2);
    }
  } else {
    editor.insertAdjacentHTML('beforeend', html);
  }
}

// ── Enter key: new <p> instead of <div> ───────────────────
editor.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || ev.shiftKey) return;

  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  let node = range.commonAncestorContainer;
  if (node.nodeType === 3) node = node.parentNode;

  // Inside a list: let browser handle it
  let check = node;
  while (check && check !== editor) {
    if (check.tagName === 'LI' || check.tagName === 'UL' || check.tagName === 'OL') return;
    check = check.parentNode;
  }

  ev.preventDefault();

  // Inherit margin from current <p> if any, otherwise use default
  let marginStyle = 'margin:0 0 12px 0;';
  let pAncestor = node;
  while (pAncestor && pAncestor !== editor) {
    if (pAncestor.tagName === 'P') { marginStyle = pAncestor.getAttribute('style') || marginStyle; break; }
    pAncestor = pAncestor.parentNode;
  }

  const p = document.createElement('p');
  p.setAttribute('style', marginStyle);
  p.innerHTML = '<br>';

  const block = nearestBlock(node);
  if (block && block !== editor) {
    block.parentNode.insertBefore(p, block.nextSibling);
  } else {
    editor.appendChild(p);
  }

  const r2 = document.createRange();
  r2.setStart(p, 0);
  r2.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r2);

  update();
  schedSave();
});

// ── Apply style to block ───────────────────────────────────
function applySelStyle(ev) {
  if (ev) ev.preventDefault();
  const idx = styleSel.value;
  if (idx === '') return;
  applyStyle(styles[idx].css);
}

function applyStyle(css) {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  let node = range.commonAncestorContainer;
  if (node.nodeType === 3) node = node.parentNode;
  const block = nearestBlock(node);
  if (block && block !== editor) {
    block.setAttribute('style', mergeStyles(block.getAttribute('style') || '', css));
  }
  update();
}

function nearestBlock(node) {
  const BLOCKS = new Set(['P','DIV','UL','OL','LI','H1','H2','H3','H4','BLOCKQUOTE','ARTICLE','SECTION']);
  while (node && node !== editor) {
    if (node.nodeType === 1 && BLOCKS.has(node.tagName)) return node;
    node = node.parentNode;
  }
  return null;
}

function mergeStyles(base, extra) {
  const map = {};
  const parse = s => s.split(';').forEach(r => {
    const idx = r.indexOf(':');
    if (idx < 0) return;
    const k = r.slice(0, idx).trim();
    const v = r.slice(idx + 1).trim();
    if (k && v) map[k] = v;
  });
  parse(base); parse(extra);
  return Object.entries(map).map(([k,v]) => `${k}:${v}`).join(';');
}

function removeStyle(ev) {
  ev.preventDefault();
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  let node = range.commonAncestorContainer;
  if (node.nodeType === 3) node = node.parentNode;
  const block = nearestBlock(node);
  if (block && block !== editor) block.removeAttribute('style');
  update();
}

// ── Style manager ──────────────────────────────────────────
function renderStyles() {
  const list = document.getElementById('styles-list');
  list.innerHTML = '';
  styles.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'sitem';
    d.id = `sitem-${i}`;
    d.innerHTML = `
      <div class="sitem-row">
        <button class="sitem-name" title="${s.css}" onmousedown="applyByIdx(event,${i})">${s.name}</button>
        <button class="sitem-edit" onclick="toggleEditStyle(${i})" title="Redigera stil">✏</button>
        <button class="sitem-del" onclick="delStyle(${i})" title="Radera stil">✕</button>
      </div>
      <div class="sitem-editor" id="sitem-editor-${i}">
        <input id="sitem-name-${i}" value="${s.name.replace(/"/g,'&quot;')}" placeholder="Stilnamn">
        <textarea id="sitem-css-${i}" placeholder="CSS">${s.css}</textarea>
        <div class="sitem-editor-btns">
          <button class="sitem-save" onclick="saveStyle(${i})">Spara</button>
          <button class="sitem-cancel" onclick="toggleEditStyle(${i})">Avbryt</button>
        </div>
      </div>`;
    list.appendChild(d);
  });
  styleSel.innerHTML = '<option value="">── Applicera stil ──</option>';
  styles.forEach((s, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = s.name;
    styleSel.appendChild(o);
  });
  saveData();
}

function toggleEditStyle(i) {
  const ed = document.getElementById(`sitem-editor-${i}`);
  ed.classList.toggle('open');
}

function saveStyle(i) {
  const name = document.getElementById(`sitem-name-${i}`).value.trim();
  const css = document.getElementById(`sitem-css-${i}`).value.trim();
  if (!name || !css) return;
  styles[i] = { name, css };
  renderStyles();
}

function applyByIdx(ev, i) {
  ev.preventDefault();
  applyStyle(styles[i].css);
}

function addStyle(ev) {
  if (ev) ev.preventDefault();
  const name = document.getElementById('new-name').value.trim();
  const css = document.getElementById('new-css').value.trim();
  if (!name || !css) return;
  styles.push({ name, css });
  renderStyles();
  document.getElementById('new-name').value = '';
  document.getElementById('new-css').value = '';
}

function delStyle(i) {
  styles.splice(i, 1);
  renderStyles();
}

// ── CSS vars ───────────────────────────────────────────────
function renderVars() {
  const cont = document.getElementById('var-rows');
  cont.innerHTML = '';
  cssVars.forEach((v, i) => {
    const d = document.createElement('div');
    d.className = 'var-row';
    d.innerHTML = `<input value="${v.name}" placeholder="--varName" oninput="cssVars[${i}].name=this.value;update();">
                   <input value="${v.value}" placeholder="värde" oninput="cssVars[${i}].value=this.value;update();">
                   <button class="sitem-del" onclick="cssVars.splice(${i},1);renderVars();update();">✕</button>`;
    cont.appendChild(d);
  });
  saveData();
}

function addVarRow() {
  cssVars.push({ name: '--', value: '' });
  renderVars();
}

// ── Copy ───────────────────────────────────────────────────
function copyHtml() {
  navigator.clipboard.writeText(htmlOut.textContent).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Kopierad!';
    setTimeout(() => btn.textContent = 'Kopiera', 2000);
  });
}

function clearAll() {
  if (!confirm('Rensa allt innehåll i editorn?')) return;
  editor.innerHTML = '<p style="margin:0 0 12px 0;"></p>';
  update();
}

// ── Drag resize ────────────────────────────────────────────
(function() {
  const handle = document.getElementById('drag-handle');
  const colEdit = document.getElementById('col-edit');
  const colPreview = document.getElementById('col-preview');
  let dragging = false, startX, startEditW, startPrevW;

  handle.addEventListener('mousedown', ev => {
    dragging = true;
    startX = ev.clientX;
    startEditW = colEdit.getBoundingClientRect().width;
    startPrevW = colPreview.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', ev => {
    if (!dragging) return;
    const dx = ev.clientX - startX;
    const newEdit = Math.max(150, startEditW + dx);
    const newPrev = Math.max(150, startPrevW - dx);
    colEdit.style.flex = 'none';
    colEdit.style.width = newEdit + 'px';
    colPreview.style.flex = 'none';
    colPreview.style.width = newPrev + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

// ── Persistence ────────────────────────────────────────────
function saveData() {
  localStorage.setItem('mhe_styles', JSON.stringify(styles));
  localStorage.setItem('mhe_vars', JSON.stringify(cssVars));
  localStorage.setItem('mhe_wrap', document.getElementById('wrap-style').value);
}

function loadData() {
  try {
    const s = localStorage.getItem('mhe_styles');
    styles = s ? JSON.parse(s) : DEFAULT_STYLES.slice();
  } catch { styles = DEFAULT_STYLES.slice(); }
  try {
    const v = localStorage.getItem('mhe_vars');
    if (v) cssVars = JSON.parse(v);
  } catch {}
  const w = localStorage.getItem('mhe_wrap');
  if (w) document.getElementById('wrap-style').value = w;
  const c = localStorage.getItem('mhe_content');
  if (c) editor.innerHTML = c;
}

let saveTimer;
function schedSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => localStorage.setItem('mhe_content', editor.innerHTML), 800);
}

// ── Events ────────────────────────────────────────────────
editor.addEventListener('input', () => { update(); schedSave(); });
editor.addEventListener('keyup', update);

// Paste: strip formatting but keep structure if it looks like HTML
editor.addEventListener('paste', ev => {
  ev.preventDefault();
  const html = ev.clipboardData.getData('text/html');
  const text = ev.clipboardData.getData('text/plain');
  // If it looks like Word/Office HTML (has mso- or o:p), clean it
  if (html && (html.includes('mso-') || html.includes('o:p') || html.includes('MsoNormal'))) {
    const cleaned = cleanWordHtml(html);
    document.execCommand('insertHTML', false, cleaned);
  } else {
    // Plain text
    document.execCommand('insertText', false, text);
  }
  update();
  schedSave();
});

document.getElementById('wrap-style').addEventListener('input', () => { update(); saveData(); });

// Close word dialog on backdrop click
document.getElementById('word-dialog').addEventListener('click', ev => {
  if (ev.target === document.getElementById('word-dialog')) closeWordDialog();
});

// ── Init ──────────────────────────────────────────────────
loadData();
renderStyles();
renderVars();
update();
</script>
